version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: eleicoes_analytics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - eleicoes_network

  # Redis for caching
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - eleicoes_network

  # MinIO for object storage
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - eleicoes_network

  # Apache Spark Master (commented out for initial testing)
  # spark-master:
  #   image: bitnami/spark:3.5
  #   environment:
  #     - SPARK_MODE=master
  #     - SPARK_RPC_AUTHENTICATION_ENABLED=no
  #     - SPARK_RPC_ENCRYPTION_ENABLED=no
  #     - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
  #     - SPARK_SSL_ENABLED=no
  #   ports:
  #     - "8080:8080"
  #     - "7077:7077"
  #   networks:
  #     - eleicoes_network

  # Apache Spark Worker (commented out for initial testing)
  # spark-worker:
  #   image: bitnami/spark:3.5
  #   environment:
  #     - SPARK_MODE=worker
  #     - SPARK_MASTER_URL=spark://spark-master:7077
  #     - SPARK_WORKER_MEMORY=2G
  #     - SPARK_WORKER_CORES=2
  #     - SPARK_RPC_AUTHENTICATION_ENABLED=no
  #     - SPARK_RPC_ENCRYPTION_ENABLED=no
  #     - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
  #     - SPARK_SSL_ENABLED=no
  #   depends_on:
  #     - spark-master
  #   networks:
  #     - eleicoes_network

  # FastAPI Application
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres123@postgres:5432/eleicoes_analytics
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minio_user
      - MINIO_SECRET_KEY=minio_password
    depends_on:
      - postgres
      - redis
      - minio
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./notebooks:/app/notebooks
    networks:
      - eleicoes_network
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload

  # Jupyter Notebook
  jupyter:
    build: .
    ports:
      - "8888:8888"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres123@postgres:5432/eleicoes_analytics
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio:9000
    volumes:
      - ./notebooks:/app/notebooks
      - ./src:/app/src
      - ./data:/app/data
    depends_on:
      - postgres
      - redis
    networks:
      - eleicoes_network
    command: python -m jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token='' --NotebookApp.password=''

  # Streamlit Dashboard Original
  streamlit:
    build: .
    ports:
      - "8501:8501"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres123@postgres:5432/eleicoes_analytics
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./src:/app/src
      - ./data:/app/data
    depends_on:
      - postgres
      - redis
      - api
    networks:
      - eleicoes_network
    command: streamlit run src/frontend/dashboard_corrigido.py --server.port=8501 --server.address=0.0.0.0

  # Streamlit Dashboard com Filtros Excel-Style
  streamlit-excel:
    build: .
    ports:
      - "8502:8502"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres123@postgres:5432/eleicoes_analytics
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./src:/app/src
      - ./data:/app/data
    depends_on:
      - postgres
      - redis
      - api
    networks:
      - eleicoes_network
    command: streamlit run src/frontend/dashboard_debug.py --server.port=8502 --server.address=0.0.0.0

  # Apache Airflow (simplified for MVP)
  airflow:
    image: apache/airflow:2.7.3
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://postgres:postgres123@postgres:5432/airflow_db
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__WEBSERVER__EXPOSE_CONFIG=True
    volumes:
      - ./src/dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
    ports:
      - "8090:8080"
    depends_on:
      - postgres
    networks:
      - eleicoes_network

volumes:
  postgres_data:
  minio_data:

networks:
  eleicoes_network:
    driver: bridge